[pytest]
# Pytest configuration for Tiny-LMS test suite

# Specify test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add test markers
markers =
    wave1: Wave 1 (User + SysAdmin)
    wave2: Wave 2 (OrgAdmin)
    user: User role tests
    sysadmin: SysAdmin role tests
    orgadmin: OrgAdmin role tests
    api: API endpoint tests
    ui: User interface tests
    display: FE display/rendering tests
    e2e: End-to-end workflow tests
    katalon: Katalon Recorder-based tests
    auth: Authentication tests
    security: Security/XSS/SQL injection tests
    slow: Slow tests (>1 second)
    integration: Integration tests
    ai: AI quiz-generation tests (OpenRouter)

# Test output options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Test paths
testpaths = .

# Python path — rootdir is the tests/ dir; add both tests/ and repo root
pythonpath = . ..

# Timeout for tests (seconds)
timeout = 30

# Ignore patterns
norecursedirs = .git .venv node_modules dist build __pycache__
